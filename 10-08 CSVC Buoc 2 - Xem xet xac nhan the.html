<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSVC Bước 2 — Xem Xét Thẻ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* Ngôn ngữ thiết kế đồng bộ "10-08 Phiếu CSVC 30Shine.html" — Xanh navy + Trắng, Be Vietnam Pro.
   2 màn hình: 4B.7A Tổng quan & danh sách thẻ (mặc định) -> tích 1 dòng -> 4B.8 Chi tiết thẻ. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F5FB;
  --fg:#10151C; --fg-muted:#5B6672; --border:rgba(20,24,31,.3);
  --accent:#143680; --accent-fg:#FFFFFF; --accent-soft:#E7EAF4;
  --danger:#D6362B; --danger-soft:#FBE4E1;
  --warning:#DD8A1F; --warning-soft:#FCEBD2;
  --success:#1F9254; --success-soft:#DFF3E7;
  --shadow:0 1px 2px rgba(16,20,24,.05),0 8px 24px -12px rgba(16,20,24,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1420; --surface:#141B29; --surface-2:#1B2434;
    --fg:#EAF0FB; --fg-muted:#8E9BB0; --border:rgba(145,160,184,.3);
    --accent:#7B9BE0; --accent-fg:#0E1420; --accent-soft:#223050;
    --danger:#F08478; --danger-soft:#3A2220;
    --warning:#F0B35E; --warning-soft:#3A2C16;
    --success:#6FD19B; --success-soft:#17301F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#141B29; --surface-2:#1B2434;
  --fg:#EAF0FB; --fg-muted:#8E9BB0; --border:rgba(145,160,184,.3);
  --accent:#7B9BE0; --accent-fg:#0E1420; --accent-soft:#223050;
  --danger:#F08478; --danger-soft:#3A2220;
  --warning:#F0B35E; --warning-soft:#3A2C16;
  --success:#6FD19B; --success-soft:#17301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); margin:0;
  font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  padding-inline:16px; max-width:600px; margin-inline:auto; min-height:100%;
}
h1,h2,h3{font-family:'Be Vietnam Pro',system-ui,sans-serif;text-wrap:balance;margin:0}
p{margin:0}
[hidden]{display:none!important}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:14px 10px;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{height:32px;width:auto;border-radius:7px;flex:none}
.brand .sub{font-size:12px;color:var(--fg-muted)}

main{padding-bottom:40px}

/* ===================== 4B.7A — TỔNG QUAN & DANH SÁCH ===================== */
.list-head{margin-top:14px;margin-bottom:12px}
.list-head h1{font-size:19px;font-weight:800}
.list-head .sub2{font-size:12.5px;color:var(--fg-muted);margin-top:3px}

/* -- stat dashboard: nổi bật hơn hẳn dòng lọc bên dưới, vẫn gọn trong 1 màn hình -- */
.stats-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.stat-row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-card{border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer}
.stat-card.all{background:var(--accent-soft);border-color:var(--accent)}
.stat-card.red{background:var(--danger-soft);border-color:var(--danger)}
.stat-card.orange{background:var(--warning-soft);border-color:var(--warning)}
.stat-card.green{background:var(--success-soft);border-color:var(--success)}
.stat-card.is-active{box-shadow:0 0 0 2px var(--fg) inset}
.stat-card .shead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.stat-card .slabel{font-size:13px;font-weight:800}
.stat-card .stotal{font-size:21px;font-weight:800}
.stat-card.all .slabel,.stat-card.all .stotal{color:var(--accent)}
.stat-card.red .slabel,.stat-card.red .stotal{color:var(--danger)}
.stat-card.orange .slabel,.stat-card.orange .stotal{color:var(--warning)}
.stat-card.green .slabel,.stat-card.green .stotal{color:var(--success)}
.stat-lines{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stat-line{
  display:flex;justify-content:space-between;align-items:center;gap:5px;
  text-align:left;padding:4px 6px;border-radius:7px;cursor:pointer;
  border:1px solid transparent;
}
.stat-line.is-active{border-color:var(--fg)}
.stat-line .slbl{font-size:10px;font-weight:700;color:var(--fg);line-height:1.2}
.stat-line .snum{font-size:15px;font-weight:800;color:var(--fg)}
.stat-card.all .stat-lines{grid-template-columns:repeat(4,1fr)}
.stat-card.all .stat-line{flex-direction:column;align-items:center;text-align:center;gap:2px;padding:5px 3px}
.stat-card.all .slbl{font-size:11px}

.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;align-items:end}
.date-field{display:flex;flex-direction:column;gap:3px;min-width:0}
.date-field .dlabel{font-size:9px;font-weight:800;color:var(--fg-muted);padding-left:11px}
.sel-filter,.date-field.btn-field{
  width:100%;font:inherit;font-weight:700;font-size:11px;cursor:pointer;
  background:none;border:none;padding:0;text-align:left;color:var(--fg);
}
.sel-filter{
  padding:9px 24px 9px 11px;border-radius:99px;
  border:1.5px solid var(--border);background:var(--surface);color:var(--fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235B6672' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;
}
.sel-filter.is-filled{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.date-field.btn-field .dval{
  display:block;font-weight:700;font-size:11px;padding:9px 11px;border-radius:99px;
  border:1.5px solid var(--border);background:var(--surface);color:var(--fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.date-field.btn-field.is-filled .dval{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:420px){.filters{grid-template-columns:repeat(2,1fr)}}

/* bottom sheet dùng chung cho các ô lọc chọn-nhiều / khoảng ngày */
.sheet-overlay{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{
  width:100%;max-width:440px;background:var(--surface);border-radius:18px;
  max-height:80vh;display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.sheet-head h3{font-size:16px;font-weight:800}
.sheet-x{background:var(--surface-2);border:none;border-radius:50%;width:30px;height:30px;font-size:14px;color:var(--fg-muted);cursor:pointer}
.sheet-body{overflow-y:auto;padding:6px 18px;flex:1}
.msel-row{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--border);font-size:13.5px;font-weight:600;cursor:pointer}
.msel-row:last-child{border-bottom:none}
.msel-row input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.sheet-foot{display:flex;gap:10px;padding:14px 18px}
.sheet-btn{flex:1;font:inherit;font-weight:800;font-size:13.5px;padding:12px;border-radius:11px;cursor:pointer;border:none}
.sheet-btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--border)}
.sheet-btn.primary{background:var(--accent);color:var(--accent-fg)}

.clear-filter{
  grid-column:1 / -1;font:inherit;font-weight:700;font-size:12px;color:var(--accent);
  background:none;border:none;cursor:pointer;padding:4px;text-align:left;
}

/* -- dòng thẻ: gọn 2 dòng, cao ~1/2.5 so với bản cũ -- */
.ticket-list{display:flex;flex-direction:column;gap:8px}
.trow{
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  column-gap:7px;row-gap:5px;width:100%;min-height:164px;text-align:left;border:1px solid var(--border);border-radius:10px;
  padding:9px 10px;cursor:pointer;font:inherit;color:var(--fg);
}
.trow.red{background:var(--danger-soft);border-color:transparent}
.trow.orange{background:var(--warning-soft);border-color:transparent}
.trow.green{background:var(--success-soft);border-color:transparent}
.rcell{
  font-size:11px;font-weight:800;color:var(--fg);line-height:1.3;min-width:0;
  overflow-wrap:break-word;align-self:center;
}
.rcell .ic{font-size:11px;margin-right:2px}
.rcell .bigicon{font-size:15px;line-height:1;font-weight:800;margin-right:3px;vertical-align:-2px}
.rcell.hint{color:var(--fg);opacity:.75;font-weight:700}
.empty-state{text-align:center;padding:40px 10px;color:var(--fg-muted);font-size:13px}

/* ===================== 4B.8 — CHI TIẾT ===================== */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;font-size:13px;
  color:var(--accent);background:none;border:none;cursor:pointer;padding:10px 0;margin-top:4px;
}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:20px 18px 22px;box-shadow:var(--shadow);margin-top:14px;
}
.card h2{font-size:16px;font-weight:800;margin-bottom:3px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:6px;display:block}
.hint{font-size:12.5px;color:var(--fg-muted);line-height:1.5;margin-bottom:14px}

.ticket{border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-top:14px}
.ticket-head{padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ticket-head.red{background:var(--danger)}
.ticket-head.orange{background:var(--warning)}
.ticket-head.green{background:var(--success)}
.ticket-head .tnum{font-size:11.5px;opacity:.85;font-weight:700;letter-spacing:.02em}
.ticket-head h1{color:#fff;font-size:18px;margin-top:3px}
.ticket-head .typebadge{background:rgba(255,255,255,.22);color:#fff;font-size:11px;font-weight:800;padding:5px 11px;border-radius:99px;white-space:nowrap}

.warn-banner{
  background:var(--warning-soft);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  font-size:12.5px;font-weight:600;color:var(--warning);margin-bottom:14px;display:flex;gap:7px;align-items:flex-start;
}
.done-banner{
  background:var(--success-soft);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  font-size:12.5px;font-weight:700;color:var(--success);margin-bottom:0;display:flex;gap:7px;align-items:flex-start;
}

.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--fg-muted);flex:0 0 42%}
.kv .v{text-align:right;font-weight:700;flex:1}

.sense-grp{margin-bottom:10px}
.sense-grp .lbl{font-size:11.5px;font-weight:800;color:var(--fg-muted);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag-pill{background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--fg)}
.tag-pill.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}

.thumbs{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.thumbs .ph{width:58px;height:58px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--fg-muted)}
.thumbs img{width:58px;height:58px;border-radius:9px;object-fit:cover;border:1px solid var(--border)}

.upload-zone{
  display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;width:100%;
  min-height:42px;border:1.5px dashed var(--border);border-radius:10px;background:var(--surface-2);
  color:var(--fg-muted);font-size:11px;font-weight:700;padding:10px;text-align:center;
}
.upload-zone input{display:none}
.upload-zone .u-ico{font-size:16px}

.thread{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:84%;padding:9px 12px;border-radius:13px;font-size:12.5px;line-height:1.5}
.msg .who{font-size:10.5px;font-weight:800;margin-bottom:2px;opacity:.7}
.msg.in{background:var(--surface-2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg.out{background:var(--accent);color:var(--accent-fg);align-self:flex-end;border-bottom-right-radius:4px}
.msg.out .who{opacity:.75}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{
  flex:1;font:inherit;font-size:13px;color:var(--fg);background:var(--surface-2);
  border:1px solid var(--border);border-radius:11px;padding:10px 12px;resize:none;min-height:42px;
}
.composer textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.composer .sendbtn{
  flex:none;background:var(--accent);color:var(--accent-fg);border:none;border-radius:11px;
  width:42px;height:42px;font-size:16px;cursor:pointer;
}
.tag-hint{font-size:11px;color:var(--fg-muted);margin-top:6px}
.tag-hint b{color:var(--accent)}

.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--fg)}
.field label .req{color:var(--danger);margin-left:2px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input.input[readonly]{background:var(--surface);color:var(--fg-muted);font-weight:700}
select.input, button.input{
  width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;padding:11px 12px;appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%235B6672' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;
}
button.input{text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.input.is-filled{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
input.input{
  width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;padding:11px 12px;
}
textarea.input{
  width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;padding:11px 12px;resize:vertical;min-height:64px;
}
textarea.input:focus{outline:2px solid var(--accent);outline-offset:1px}

.chip-row{display:flex;gap:8px}
.chip-row .chip{
  position:relative;flex:1;text-align:center;border:1.5px solid var(--border);border-radius:11px;
  background:var(--surface-2);padding:12px 6px;font-size:13px;font-weight:800;cursor:pointer;color:var(--fg);
}
.chip-row .chip input{position:absolute;opacity:0;pointer-events:none}
.chip-row.pri .chip:nth-child(1):has(input:checked){border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.chip-row.pri .chip:nth-child(2):has(input:checked){border-color:var(--warning);background:var(--warning-soft);color:var(--warning)}
.chip-row.pri .chip:nth-child(3):has(input:checked){border-color:var(--success);background:var(--success-soft);color:var(--success)}
.chip-row.yn .chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.callout{background:var(--accent-soft);border:1px solid var(--border);border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.55;color:var(--fg);margin-top:14px}
.callout b{color:var(--accent)}

details.guide{border:1px solid var(--border);border-radius:12px;margin-top:16px;overflow:hidden}
details.guide summary{
  cursor:pointer;list-style:none;padding:12px 14px;font-size:13px;font-weight:700;
  display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);
}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary .chev{transition:transform .15s;color:var(--fg-muted)}
details.guide[open] summary .chev{transform:rotate(180deg)}
.guide-tbl{width:100%;border-collapse:collapse;font-size:12px}
.guide-tbl td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:top;line-height:1.5}
.guide-tbl td:first-child{color:var(--fg-muted);width:38%}

.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--border);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.bottombar-inner{max-width:600px;margin:0 auto}
.btn{font:inherit;font-weight:800;font-size:14.5px;border-radius:12px;border:none;padding:14px 16px;cursor:pointer;width:100%;
  display:flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:var(--accent-fg)}
.btn.phone-call{background:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.success-strip{display:flex;align-items:center;gap:10px;background:var(--success-soft);color:var(--success);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;font-weight:700}
.restart-btn{width:100%;margin-top:16px;padding:13px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-weight:700;font-size:14px;cursor:pointer}
</style>
</head>

function parseCreated(str){
  const [datePart, timePart] = str.split(" ");
  const [d,m,y] = datePart.split("/").map(Number);
  const [hh,mm] = timePart.split(":").map(Number);
  return new Date(y, m-1, d, hh, mm).getTime();
}

function computeStats(color){
  const subset = TICKETS
    .filter(t=> color==="all" || t.sysColor===color)
    .filter(t=> filters.gdkv.length===0 || filters.gdkv.includes(t.gdkv))
    .filter(t=> filters.vung.length===0 || filters.vung.includes(t.vung))
    .filter(t=> filters.salon.length===0 || filters.salon.includes(t.salon))
    .filter(t=> filters.type.length===0 || filters.type.includes(t.typeKey))
    .filter(t=> filters.progress.length===0 || filters.progress.includes(t.progress))
    .filter(t=> filters.group.length===0 || filters.group.includes(t.group))
    .filter(t=> filters.device.length===0 || filters.device.includes(t.device))
    .filter(t=> filters.assigneeType.length===0 || filters.assigneeType.includes(assigneeTypeOf(t)))
    .filter(t=> !dateFilters.createdFrom || t.createdISO>=dateFilters.createdFrom)
    .filter(t=> !dateFilters.createdTo || t.createdISO<=dateFilters.createdTo)
    .filter(t=> !dateFilters.dueFrom || t.dueISO>=dateFilters.dueFrom)
    .filter(t=> !dateFilters.dueTo || t.dueISO<=dateFilters.dueTo);
  const counts = {chuaxem:0, chuaxacnhan:0, daxacnhan:0, xulytuxa:0};
  subset.forEach(t=> counts[t.status]++);
  return {total:subset.length, counts};
}
const STAT_CARD_LABEL = {all:"Tất cả màu", red:"🔴 Đỏ", orange:"🟠 Cam", green:"🟢 Xanh"};
function cardMatchesColor(c){ return c==="all" ? filters.color.length===0 : (filters.color.length===1 && filters.color[0]===c); }

function renderStats(){
  const host = document.getElementById("statsWrap");
  const allCard = buildStatCard("all");
  const row3 = `<div class="stat-row3">${buildStatCard("red")}${buildStatCard("orange")}${buildStatCard("green")}</div>`;
  host.innerHTML = allCard + row3;
}
function buildStatCard(c){
  const st = computeStats(c);
  const cardActive = cardMatchesColor(c) ? "is-active" : "";
  const lines = STATUS_ORDER.map(k=>{
    const active = (cardMatchesColor(c) && filters.status.length===1 && filters.status[0]===k) ? "is-active" : "";
    return `<div class="stat-line ${active}" data-color="${c}" data-status="${k}"><span class="slbl">${STATUS_LABEL[k]}</span><span class="snum">${st.counts[k]}</span></div>`;
  }).join("");
  return `
    <div class="stat-card ${c} ${cardActive}" data-color="${c}">
      <div class="shead"><span class="slabel">${STAT_CARD_LABEL[c]}</span><span class="stotal">${st.total}</span></div>
      <div class="stat-lines">${lines}</div>
    </div>`;
}

document.getElementById("statsWrap").addEventListener("click", e=>{
  const line = e.target.closest(".stat-line");
  const card = e.target.closest(".stat-card");
  if(line){
    filters.color = line.dataset.color==="all" ? [] : [line.dataset.color];
    filters.status = [line.dataset.status];
  } else if(card){
    filters.color = card.dataset.color==="all" ? [] : [card.dataset.color];
    filters.status = [];
  } else return;
  updateMultiTriggerLabel("color");
  updateMultiTriggerLabel("status");

/* ===================== DANH SÁCH ===================== */
function sortedFiltered(){
  const list = TICKETS
    .filter(t => filters.color.length===0 || filters.color.includes(t.sysColor))
    .filter(t => filters.status.length===0 || filters.status.includes(t.status))
    .filter(t => filters.gdkv.length===0 || filters.gdkv.includes(t.gdkv))
    .filter(t => filters.vung.length===0 || filters.vung.includes(t.vung))
    .filter(t => filters.salon.length===0 || filters.salon.includes(t.salon))
    .filter(t => filters.type.length===0 || filters.type.includes(t.typeKey))
    .filter(t => filters.progress.length===0 || filters.progress.includes(t.progress))
    .filter(t => filters.group.length===0 || filters.group.includes(t.group))
    .filter(t => filters.device.length===0 || filters.device.includes(t.device))
    .filter(t => filters.assigneeType.length===0 || filters.assigneeType.includes(assigneeTypeOf(t)))
    .filter(t => !dateFilters.createdFrom || t.createdISO>=dateFilters.createdFrom)
    .filter(t => !dateFilters.createdTo || t.createdISO<=dateFilters.createdTo)
    .filter(t => !dateFilters.dueFrom || t.dueISO>=dateFilters.dueFrom)
    .filter(t => !dateFilters.dueTo || t.dueISO<=dateFilters.dueTo)
    .slice();
  list.sort((a,b)=> COLOR_RANK[a.sysColor]-COLOR_RANK[b.sysColor] || a.dueShort.localeCompare(b.dueShort));
  return list;
}

function renderList(){
  const list = sortedFiltered();
  const host = document.getElementById("ticketList");
  if(!list.length){
    host.innerHTML = `<div class="empty-state">Không có thẻ nào khớp bộ lọc.</div>`;

  });
  document.getElementById("afterPhoto").addEventListener("change", function(){
    const files = Array.from(this.files||[]);
    step5Photos = files.map(f=>f.name);
    const host = document.getElementById("afterThumbs");
    host.innerHTML = "";
    files.slice(0,6).forEach(f=>{
      const img = document.createElement("img");
      img.src = URL.createObjectURL(f); img.alt = f.name;
      host.appendChild(img);
    });
    updateButton();
  });
  step5ExtraPhotos = {invoicePhoto:[], materialPhoto:[], acceptancePhoto:[]};
  ["invoicePhoto","materialPhoto","acceptancePhoto"].forEach(wireRequiredPhotoInput);

  updateButton();
}

function wireRequiredPhotoInput(inputId){
  const input = document.getElementById(inputId);
  const host = document.getElementById(inputId.replace("Photo","Thumbs"));
  input.addEventListener("change", function(){
    const files = Array.from(this.files||[]);
    step5ExtraPhotos[inputId] = files.map(f=>f.name);
    host.innerHTML = "";
    files.slice(0,6).forEach(f=>{
      const img = document.createElement("img");
      img.src = URL.createObjectURL(f); img.alt = f.name;
      host.appendChild(img);
    });
    updateButton();
  });
}

function updateActualTotalCost(){
  const vatTu = Number(document.getElementById("actualMaterialCost").value) || 0;
  const nhanCong = Number(document.getElementById("actualLaborCost").value) || 0;
  document.getElementById("actualTotalCost").value = (vatTu + nhanCong).toLocaleString("vi-VN") + " đ";
}

function isStep5Valid(){
  const prog = document.getElementById("progressSelect")?.value;
  if(!prog) return false;
  const matCost = document.getElementById("actualMaterialCost")?.value;
  const laborCost = document.getElementById("actualLaborCost")?.value;
  if(matCost==="" || matCost===undefined || laborCost==="" || laborCost===undefined) return false;
  if(step5ExtraPhotos.invoicePhoto.length===0 || step5ExtraPhotos.materialPhoto.length===0 || step5ExtraPhotos.acceptancePhoto.length===0) return false;
  if(prog==="daxuly"){
    const ap = document.getElementById("actualPlan")?.value.trim();
    const rt = document.getElementById("resultText")?.value.trim();
    if(!ap || !rt || step5Photos.length===0) return false;
  }
  return true;
}

function updateStep5Button(){
  const btn = document.getElementById("nextBtn");
  if(!btn || btn.dataset.sent) return;
  btn.classList.remove("phone-call");
  btn.disabled = !isStep5Valid();
  const prog = document.getElementById("progressSelect")?.value;
  btn.textContent = prog==="daxuly" ? "Hoàn thành Bước 5 — Chuyển sang Bước 6 (Nghiệm thu)" : "💾 Cập nhật tiến độ";
}

function submitStep5(){
  if(!isStep5Valid()) return;
  const prog = document.getElementById("progressSelect").value;
  const matCost = Number(document.getElementById("actualMaterialCost").value) || 0;
  const laborCost = Number(document.getElementById("actualLaborCost").value) || 0;
  const totalCost = matCost + laborCost;
  if(prog!=="daxuly"){
    document.getElementById("step5ConfirmPanel").innerHTML = `
      <div class="card"><div class="success-strip">✅ Đã cập nhật tiến độ: ${PROGRESS_LABEL2[prog]}.</div></div>`;
    document.getElementById("step5ConfirmPanel").scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  const btn = document.getElementById("nextBtn");
  btn.dataset.sent = "1";
  btn.disabled = true;
  const s = currentTicket;
  document.getElementById("step5ConfirmPanel").innerHTML = `
    <div class="card">
      <div class="success-strip">✅ Đã hoàn thành Bước 5 cho THẺ ${s.id} — chuyển sang Bước 6 (Nghiệm thu, do SM thực hiện).</div>
      <div class="kv"><span class="k">Kết quả thực hiện</span><span class="v">${document.getElementById("resultText").value.trim()}</span></div>
      <div class="kv"><span class="k">Tổng tiền thực tế</span><span class="v">${totalCost.toLocaleString("vi-VN")} đ</span></div>
      <button class="restart-btn" id="toListBtn5">↺ Quay lại danh sách</button>
    </div>`;
  document.getElementById("detailBar").hidden = true;
  document.getElementById("step5ConfirmPanel").scrollIntoView({behavior:"smooth", block:"start"});
  document.getElementById("step5ConfirmPanel").querySelector("#toListBtn5").addEventListener("click", closeDetail);
}

function renderDetail(){
  const s = currentTicket;
  const tm = TYPE_META[s.typeKey];

  document.getElementById("ticketHead").innerHTML = `
    <div class="ticket">
      <div class="ticket-head ${s.sysColor}">
        <div><div class="tnum">THẺ ${s.id}</div><h1>${s.salon}</h1></div>
        <span class="typebadge">${tm.icon} ${tm.label}</span>
      </div>
    </div>`;

  const senseHtml = s.senses.map(g=>`
    <div class="sense-grp">
      <div class="lbl">${g.icon} ${g.label}</div>
      <div class="tag-list">${g.items.map(it=>`<span class="tag-pill ${g.danger?'danger':''}">${it}</span>`).join("")}</div>
    </div>`).join("");

  const photosHtml = Array.from({length:s.photos}).map(()=>`<div class="ph">📷</div>`).join("");

  document.getElementById("ticketInfo").innerHTML = `
    <div class="card">
      ${!s.isSM ? `<div class="warn-banner">⚠️ <span>Báo bởi nhân viên thay SM: <b>${s.senderName}</b> — ${s.senderPhone}</span></div>` : ""}
      <div class="kv"><span class="k">Người gửi</span><span class="v">${s.isSM ? "SM salon" : s.senderName}</span></div>
      <div class="kv"><span class="k">GĐKV</span><span class="v">${s.gdkv}</span></div>
      <div class="kv"><span class="k">Vùng</span><span class="v">${s.vung}</span></div>
      <div class="kv"><span class="k">Ngày tạo</span><span class="v">${s.created}</span></div>
      <div class="kv"><span class="k">Thiết bị</span><span class="v">${s.group} → ${s.device}</span></div>
      <div class="kv"><span class="k">Vị trí</span><span class="v">${s.floor} — ${s.area}</span></div>
      <div class="kv"><span class="k">Số lượng</span><span class="v">${s.qty}</span></div>
      ${senseHtml ? `<div style="margin-top:12px">${senseHtml}</div>` : ""}
      ${s.note ? `<div class="kv"><span class="k">Ghi thêm</span><span class="v">${s.note}</span></div>` : ""}
      <div class="kv"><span class="k">Mức độ nguy hiểm</span><span class="v">${s.danger}</span></div>
      <div class="kv"><span class="k">Mức độ gấp</span><span class="v">${s.urgent}</span></div>
      <div class="kv"><span class="k">Ngày SM mong muốn</span><span class="v">${s.due}</span></div>
      <div class="field" style="margin-top:12px;margin-bottom:0">
        <label style="margin-bottom:7px">Ảnh đính kèm</label>
        <div class="thumbs">${photosHtml}</div>
      </div>
    </div>`;

  const area = document.getElementById("step2Area");

  if(s.status==="daxacnhan" || s.status==="xulytuxa"){
    document.getElementById("detailBar").hidden = true;
    area.innerHTML = `
      <div class="card">
        <span class="eyebrow">CSVC · Bước 2</span>
        <h2>${s.status==="xulytuxa" ? "Đã xử lý từ xa" : "Đã hoàn tất xác nhận"}</h2>
        <div class="done-banner">${s.status==="xulytuxa" ? "✅ CSVC đã hướng dẫn sơ bộ — SM tự xử lý được, thẻ đóng ở trạng thái Đã xử lý từ xa (không qua Bước 4/5/6)." : "✅ CSVC đã xác nhận màu + thông tin ở Bước 2 — thẻ đang ở bước xử lý tiếp theo (Bước 3/4/5)."}</div>
        ${s.status==="daxacnhan" ? `<button class="btn" style="margin-top:14px" id="toStep4FromDone">Xem tiếp → Bước 4: Ra quyết định phương án</button>` : ""}
      </div>`;
    if(s.status==="daxacnhan"){
      document.getElementById("toStep4FromDone").addEventListener("click", openStep4);
    }
    return;
  }

  area.innerHTML = `
    <div class="card">
      <span class="eyebrow">CSVC điền vào thẻ — Bước 2</span>
      <h2>Xác nhận & bổ sung</h2>

      <div class="field">
        <label>Màu ưu tiên <span class="req">*</span></label>
        <div class="chip-row pri" id="priChips">
          <label class="chip"><input type="radio" name="pri" value="red">🔴 Đỏ</label>
          <label class="chip"><input type="radio" name="pri" value="orange">🟠 Cam</label>
          <label class="chip"><input type="radio" name="pri" value="green">🟢 Xanh</label>
        </div>
        <p class="hint" style="margin-top:8px;margin-bottom:0">Hệ thống đã gắn sẵn theo câu trả lời SM — CSVC xác nhận hoặc điều chỉnh nếu đánh giá thực tế khác.</p>
      </div>

      <div class="field">
        <label>Cần bổ sung thông tin? <span class="req">*</span></label>
        <div class="chip-row yn" id="needChips">
          <label class="chip"><input type="radio" name="need" value="yes">Có</label>
          <label class="chip"><input type="radio" name="need" value="no">Không</label>
        </div>
      </div>

      <div class="field" id="questionWrap" hidden>
        <label>Câu hỏi cần hỏi thêm <span class="req">*</span></label>
        <textarea class="input" id="questionText" placeholder="VD: @SM cho anh xin thêm ảnh góc rộng của khu vực này"></textarea>
      </div>

      <details class="guide">
        <summary>💡 Hướng dẫn xử lý khi thông tin thiếu <span class="chev">▾</span></summary>
        <table class="guide-tbl">
          <tr><td>Không rõ vị trí thiết bị</td><td>Nhắn qua Giao tiếp trong thẻ — tag tên SM để SM nhận thông báo và trả lời</td></tr>
          <tr><td>Thiếu ảnh, cần xem trước khi quyết định</td><td>Yêu cầu SM chụp bổ sung qua Giao tiếp trong thẻ</td></tr>
          <tr><td>Biểu hiện chưa rõ + thẻ 🟢</td><td>Ghi nhận, lên lịch xử lý bình thường — CSVC đánh giá thực tế khi đến nơi</td></tr>
          <tr><td>Biểu hiện chưa rõ + thẻ 🔴 / 🟠</td><td>Gọi điện SM ngay để hỏi thêm chi tiết — đồng thời phân công người đến xử lý</td></tr>
        </table>
      </details>

      <div class="callout" id="ruleCallout"></div>
    </div>

    <div id="confirmPanel"></div>
    ${commCardHtml([
      {who:"in", name:"Tiến — CSVC", text:"Chào em, anh xem thẻ rồi. Cho anh hỏi thiết bị ở ngay cửa ra vào khu đó hay trong góc trong vậy?"},
      {who:"out", name:"SM salon", text:"Dạ ở góc trong cùng anh ơi, gần cửa sổ"}
    ])}`;

  document.getElementById("detailBar").hidden = false;
  picked.pri = s.sysColor;
  picked.need = null;
  document.querySelectorAll('#priChips input').forEach(r=> r.checked = (r.value===s.sysColor));
  const btn = document.getElementById("nextBtn");
  delete btn.dataset.sent;

  document.querySelectorAll('#priChips input').forEach(r=> r.addEventListener('change', e=>{
    picked.pri = e.target.value; updateCallout(); updateButton();
  }));
  document.querySelectorAll('#needChips input').forEach(r=> r.addEventListener('change', e=>{
    picked.need = e.target.value;
    document.getElementById("questionWrap").hidden = (picked.need!=="yes");
    updateButton();
  }));
  document.getElementById("questionText").addEventListener('input', updateButton);

  updateCallout();
  updateButton();
}

function updateCallout(){
  const el = document.getElementById("ruleCallout");
  if(!el) return;
  if(picked.pri==="red" || picked.pri==="orange"){
    el.innerHTML = `<b>Nguyên tắc:</b> thẻ 🔴🟠 không chờ thêm thông tin — gọi điện hỏi trực tiếp, đồng thời phân công người đến.`;
  } else {
    el.innerHTML = `<b>Nguyên tắc:</b> thẻ 🟢 ghi nhận bình thường — CSVC đánh giá thực tế khi đến nơi, không bắt buộc gọi điện ngay.`;
  }
}

function isValid(){
  if(!picked.pri || !picked.need) return false;
  const q = document.getElementById("questionText");
  if(picked.need==="yes" && (!q || !q.value.trim())) return false;
  return true;
}

function updateButton(){
  if(currentStep==="step4"){ updateStep4Button(); return; }
  if(currentStep==="step5"){ updateStep5Button(); return; }
  const btn = document.getElementById("nextBtn");
  if(!btn || btn.dataset.sent) return;
  btn.disabled = !isValid();
  if(picked.pri==="red"){
    btn.classList.add("phone-call");
    btn.textContent = "☎️ Đã gọi điện SM — Chuyển sang Bước 4";
  } else {
    btn.classList.remove("phone-call");
    btn.textContent = "Hoàn thành Bước 2 — Chuyển sang Bước 3";
  }
}

document.getElementById("nextBtn").addEventListener('click', function(){
  if(currentStep==="step4"){ submitStep4(); return; }
  if(currentStep==="step5"){ submitStep5(); return; }
  if(this.dataset.sent || !isValid()) return;
  this.dataset.sent = "1";
  this.disabled = true;
  const s = currentTicket;
  const nextStep = picked.pri==="red" ? "Bước 4 — Ra quyết định phương án" : "Bước 3 — Hướng dẫn sơ bộ";
  const qEl = document.getElementById("questionText");
  document.getElementById("confirmPanel").innerHTML = `
    <div class="card">
      <div class="success-strip">✅ Đã lưu Bước 2 cho THẺ ${s.id} — chuyển sang ${nextStep}. Thẻ cập nhật tình trạng "Đã xác nhận" trong bảng tổng quan.</div>
      <div class="kv"><span class="k">Màu xác nhận</span><span class="v">${PRI_META[picked.pri].label}</span></div>
      <div class="kv"><span class="k">Cần bổ sung thông tin?</span><span class="v">${picked.need==="yes"?"Có":"Không"}</span></div>
      ${picked.need==="yes" ? `<div class="kv"><span class="k">Câu hỏi đã gửi SM</span><span class="v">${qEl.value}</span></div>` : ""}
      ${picked.pri!=="red" ? `<div class="callout">Bước 3 — Hướng dẫn sơ bộ (chỉ 🟠🟢) chưa dựng màn hình demo riêng — bấm tiếp tục bên dưới để xem thẳng demo Bước 4.</div>` : ""}
      <button class="btn" style="margin-top:14px" id="toStep4Btn">Tiếp tục → Bước 4: Ra quyết định phương án</button>
      <button class="restart-btn" id="toListBtn">↺ Quay lại danh sách</button>
    </div>`;
  document.getElementById("confirmPanel").scrollIntoView({behavior:"smooth", block:"start"});
  document.getElementById("confirmPanel").querySelector("#toListBtn").addEventListener("click", closeDetail);
  document.getElementById("confirmPanel").querySelector("#toStep4Btn").addEventListener("click", openStep4);
});

renderAll();
})();
</script>
</body>
</html>
