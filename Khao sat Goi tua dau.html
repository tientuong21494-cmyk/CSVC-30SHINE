<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Khảo sát Gối/Ghế</title>
<style>
  :root{
    --bg:#F3F5F7; --surface:#FFFFFF; --surface-alt:#EAEEF3;
    --ink:#1B222C; --ink-muted:#5B6472; --ink-faint:#8891A0;
    --border:#DCE2E9; --border-soft:#E9EDF2;
    --accent:#1D3557; --accent-strong:#132840; --accent-soft:#E4EAF3;
    --ok:#1F7A4D; --ok-soft:#E4F3EA; --bad:#B3311C; --bad-soft:#FBEAE7;
    --shadow-sm:0 1px 2px rgba(20,26,36,.06), 0 1px 1px rgba(20,26,36,.04);
    --shadow-md:0 8px 24px rgba(20,26,36,.08);
    --font: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161C; --surface:#181D25; --surface-alt:#1F2530;
      --ink:#E7EAEE; --ink-muted:#9AA4B2; --ink-faint:#6B7382;
      --border:#2B323E; --border-soft:#242A35;
      --accent:#7EA0CE; --accent-strong:#9FBBE0; --accent-soft:#1E2A3E;
      --ok:#5FBE8B; --ok-soft:#173226; --bad:#E28A7C; --bad-soft:#32201C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161C; --surface:#181D25; --surface-alt:#1F2530;
    --ink:#E7EAEE; --ink-muted:#9AA4B2; --ink-faint:#6B7382;
    --border:#2B323E; --border-soft:#242A35;
    --accent:#7EA0CE; --accent-strong:#9FBBE0; --accent-soft:#1E2A3E;
    --ok:#5FBE8B; --ok-soft:#173226; --bad:#E28A7C; --bad-soft:#32201C;
  }
  :root[data-theme="light"]{
    --bg:#F3F5F7; --surface:#FFFFFF; --surface-alt:#EAEEF3;
    --ink:#1B222C; --ink-muted:#5B6472; --ink-faint:#8891A0;
    --border:#DCE2E9; --border-soft:#E9EDF2;
    --accent:#1D3557; --accent-strong:#132840; --accent-soft:#E4EAF3;
    --ok:#1F7A4D; --ok-soft:#E4F3EA; --bad:#B3311C; --bad-soft:#FBEAE7;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:600px; margin:0 auto; padding:1.4rem 1.1rem 5rem; }
  header.hd{ margin-bottom:1.4rem; }
  header.hd p.eyebrow{ font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 .3rem; font-weight:700; }
  header.hd h1{ font-size:1.5rem; margin:0 0 .3rem; letter-spacing:-.01em; }
  header.hd p.sub{ color:var(--ink-muted); font-size:.92rem; margin:0; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:1.2rem 1.2rem 1.3rem; margin-bottom:1rem; }
  .card h2{ font-size:.98rem; margin:0 0 .9rem; display:flex; align-items:center; gap:.5rem; }
  .card h2 .n{ display:inline-flex; align-items:center; justify-content:center; width:1.5rem; height:1.5rem; border-radius:50%; background:var(--accent); color:#fff; font-size:.76rem; font-weight:700; flex:none; }
  .item-thumb{ display:block; width:100%; max-height:420px; object-fit:contain; background:var(--surface-alt); border-radius:9px; border:1px solid var(--border); margin-bottom:.9rem; }
  .field{ margin-bottom:.95rem; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:.82rem; font-weight:600; color:var(--ink); margin-bottom:.35rem; }
  .field .hint{ font-size:.76rem; color:var(--ink-faint); margin-top:.3rem; }
  .req{ color:var(--bad); }
  input[type="text"], input[type="number"], select{
    width:100%; font-family:inherit; font-size:.92rem; color:var(--ink); background:var(--surface-alt);
    border:1px solid var(--border); border-radius:9px; padding:.6rem .7rem; outline:none;
  }
  input:focus, select:focus{ border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 3px var(--accent-soft); }
  input[readonly]{ color:var(--ink-muted); background:var(--border-soft); }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
  @media (max-width:480px){ .row-2{ grid-template-columns:1fr; } }
  .photo-input{ border:1px dashed var(--border); border-radius:9px; padding:.7rem; text-align:center; cursor:pointer; background:var(--surface-alt); font-size:.82rem; color:var(--ink-muted); }
  .photo-input input{ display:none; }
  .photo-thumbs{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem; }
  .photo-thumb{ position:relative; width:56px; height:56px; }
  .photo-thumb img{ display:block; width:56px; height:56px; object-fit:cover; border-radius:7px; border:1px solid var(--border); }
  .photo-thumb .rm{ position:absolute; top:-6px; right:-6px; width:18px; height:18px; line-height:18px; text-align:center; font-size:.7rem; font-weight:700; color:#fff; background:var(--bad); border-radius:50%; cursor:pointer; }
  .submit-btn{ width:100%; padding:.85rem; font-size:.98rem; font-weight:700; color:#fff; background:var(--accent); border:none; border-radius:10px; cursor:pointer; box-shadow:var(--shadow-md); }
  .submit-btn:hover{ background:var(--accent-strong); }
  .errs{ background:var(--bad-soft); border:1px solid var(--bad); color:var(--bad); border-radius:9px; padding:.7rem .8rem; font-size:.84rem; margin-bottom:1rem; display:none; }
  .errs.show{ display:block; }
  .dup-warn{ background:var(--bad-soft); border:1px solid var(--bad); color:var(--bad); border-radius:9px; padding:.7rem .8rem; font-size:.82rem; margin-top:.9rem; display:none; }
  .dup-warn.show{ display:block; }
  .zero-note{ background:var(--ok-soft); border:1px solid var(--ok); color:var(--ink); border-radius:9px; padding:.6rem .7rem; font-size:.8rem; margin-top:.4rem; }
  .summary-overlay{ position:fixed; inset:0; background:rgba(10,14,20,.55); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:1.5rem 1rem; overflow-y:auto; }
  .summary-overlay.show{ display:flex; }
  .summary-card{ background:var(--surface); border-radius:16px; max-width:480px; width:100%; padding:1.4rem 1.4rem 1.6rem; box-shadow:var(--shadow-md); }
  .summary-card h3{ margin:0 0 .2rem; font-size:1.15rem; display:flex; align-items:center; gap:.5rem; }
  .summary-card .ok-dot{ width:1.6rem; height:1.6rem; border-radius:50%; background:var(--ok-soft); color:var(--ok); display:flex; align-items:center; justify-content:center; font-size:1rem; flex:none; }
  .summary-card p.note{ color:var(--ink-muted); font-size:.82rem; margin:.2rem 0 1rem; }
  .summary-table{ width:100%; border-collapse:collapse; font-size:.86rem; margin-bottom:.8rem; }
  .summary-table tr{ border-bottom:1px solid var(--border-soft); }
  .summary-table td{ padding:.4rem .2rem; vertical-align:top; }
  .summary-table td.k{ color:var(--ink-faint); width:54%; font-weight:600; }
  .summary-table td.v{ color:var(--ink); }
  .summary-close{ margin-top:1.2rem; width:100%; padding:.7rem; border-radius:9px; border:1px solid var(--border); background:var(--surface-alt); color:var(--ink); font-weight:700; font-size:.9rem; cursor:pointer; }
</style>

<div id="failBanner" style="display:none;position:sticky;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:12px 14px;z-index:9999;font-weight:600;font-size:.86rem;">
  <span id="failBannerText"></span>
  <button type="button" id="failBannerBtn" style="display:block;margin-top:8px;background:#fff;color:#dc2626;border:none;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;">🔄 Gửi lại</button>
</div>
<div class="wrap">
  <header class="hd">
    <p class="eyebrow">30Shine · Nội bộ</p>
    <h1>Khảo sát Gối/Ghế đầu giường</h1>
    <p class="sub">Điền số lượng và tình trạng hỏng/rách cho tất cả các mục dưới đây, gửi 1 lần duy nhất cho cả salon.</p>
  </header>

  <div class="errs" id="errBox"></div>

  <form id="surveyForm" novalidate>
    <div class="card">
      <div class="field">
        <label for="salon">Salon <span class="req">*</span></label>
        <select id="salon" required>
          <option value="" disabled selected>— Chọn salon —</option>
        </select>
        <div class="dup-warn" id="dupWarn"></div>
      </div>
      <div class="field">
        <label for="gdkv">GDKV</label>
        <input type="text" id="gdkv" readonly placeholder="Tự động hiện sau khi chọn salon">
      </div>
    </div>

    <div id="itemsContainer"></div>

    <button type="submit" class="submit-btn">Gửi khảo sát toàn bộ salon</button>
  </form>
</div>

<div class="summary-overlay" id="summaryOverlay">
  <div class="summary-card">
    <h3><span class="ok-dot">✓</span>Đã gửi khảo sát</h3>
    <p class="note">Dữ liệu bên dưới đã được ghi nhận vào hệ thống (hệ thống sẽ tự kiểm tra ở nền — nếu gửi thất bại sẽ có cảnh báo đỏ ở đầu trang).</p>
    <div id="summaryBody"></div>
    <button type="button" class="summary-close" id="summaryClose">Đóng</button>
  </div>
</div>

  function compressImage(file){
    var MAX_DIM = 1200;
    var QUALITY = 0.75;
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if (w > MAX_DIM || h > MAX_DIM){
            if (w > h){ h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
            else { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', QUALITY);
          resolve({
            name: file.name.replace(/\.[^.]+$/, '') + '.jpg',
            type: 'image/jpeg',
            data: dataUrl.substring(dataUrl.indexOf(',') + 1)
          });
        };
        img.onerror = function(){ reject(new Error('image load failed')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(reader.error); };
      reader.readAsDataURL(file);
    });
  }

        rm.className = 'rm'; rm.textContent = '×';
        rm.addEventListener('click', function(){
          itemState[idx].selectedFiles.splice(i, 1);
          renderThumbs();
        });
        cell.appendChild(im); cell.appendChild(rm);
        thumbs.appendChild(cell);
      });
    }
    photoInput.addEventListener('change', function(){
      var newFiles = Array.prototype.slice.call(photoInput.files);
      photoInput.value = '';
      var overflow = false;
      newFiles.forEach(function(f){
        if (itemState[idx].selectedFiles.length >= MAX_PHOTOS){ overflow = true; return; }
        itemState[idx].selectedFiles.push(f);
      });
      if (overflow){
        alert('Chỉ được chọn tối đa ' + MAX_PHOTOS + ' ảnh cho 1 mục. Xoá bớt ảnh cũ nếu muốn chụp thêm.');
      }
      renderThumbs();
    });

    var tongEl = tongField.querySelector('input');
    var hongEl = hongField.querySelector('input');
    tongEl.addEventListener('input', function(){
      var v = parseInt(tongEl.value, 10);
      if (v === 0){
        hongEl.value = '0'; hongEl.disabled = true;
        zeroNote.style.display = 'block';
        photoField.style.display = 'none';
      } else {
        hongEl.disabled = false;
        zeroNote.style.display = 'none';
        photoField.style.display = '';
      }
    });

    itemsContainer.appendChild(card);
  });

  var dupWarn = document.getElementById('dupWarn');
  function checkDuplicate(){
    dupWarn.classList.remove('show');
    if (!salonSel.value || SHEET_ENDPOINT.indexOf('DAN_URL_APPS_SCRIPT') !== -1) return;
    fetch(SHEET_ENDPOINT).then(function(r){ return r.json(); }).then(function(data){
      if (!Array.isArray(data)) return;
      var matches = data.filter(function(row){ return row[1] === salonSel.value; });
      if (matches.length){
        var lastRow = matches[matches.length - 1];
        var lastTimeText = lastRow[0];
        try { lastTimeText = new Date(lastRow[0]).toLocaleString('vi-VN'); } catch (e) {}
        dupWarn.textContent = '⚠️ Salon ' + salonSel.value + ' đã có dữ liệu trước đó — điền lần gần nhất lúc ' + lastTimeText + '. Nếu gửi tiếp, các mục trùng tên sẽ bị THAY THẾ hoàn toàn.';
        dupWarn.classList.add('show');
      }
    }).catch(function(){});
  }

  var form = document.getElementById('surveyForm');
  var errBox = document.getElementById('errBox');
  var overlay = document.getElementById('summaryOverlay');
  var summaryBody = document.getElementById('summaryBody');
  var failBanner = document.getElementById('failBanner');
  var failBannerText = document.getElementById('failBannerText');
  var failBannerBtn = document.getElementById('failBannerBtn');
  var failedPayloads = [];

  function sendPayload(payload, attempt){
    attempt = attempt || 1;
    return fetch(SHEET_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(payload)
    }).catch(function(err){
      if (attempt < 3){
        return new Promise(function(resolve){ setTimeout(resolve, attempt * 2000); })
          .then(function(){ return sendPayload(payload, attempt + 1); });
      }
      throw err;
    });
  }

  var VERIFY_MAX_TRIES = 16;
  function verifySaved(payload, tries){
    tries = tries || 0;
    return new Promise(function(resolve){ setTimeout(resolve, 6000); }).then(function(){
      return fetch(SHEET_ENDPOINT).then(function(r){ return r.json(); }).then(function(data){
        var now = Date.now();
        var ok = payload.items.every(function(it){
          return data.some(function(row){
            if (row[1] !== payload.salon || row[3] !== it.ten) return false;
            var t = new Date(row[0]).getTime();
            return !isNaN(t) && (now - t) < 10 * 60 * 1000;
          });
        });
        if (ok) return true;
        if (tries < VERIFY_MAX_TRIES) return verifySaved(payload, tries + 1);
        return false;
      }).catch(function(){
        if (tries < VERIFY_MAX_TRIES) return verifySaved(payload, tries + 1);
        return null;
      });
    });
  }

  function updateFailBanner(){
    if (failedPayloads.length === 0){
      failBanner.style.display = 'none';
    } else {
      failBanner.style.display = 'block';
      failBannerText.textContent = '⚠️ ' + failedPayloads.length + ' lượt gửi CHƯA thành công (nghi do mất mạng): ' +
        failedPayloads.map(function(p){ return p.salon; }).join('; ');
    }
  }

  function backgroundSend(payload){
    return sendPayload(payload).then(function(){
      return verifySaved(payload);
    }).then(function(ok){
      if (ok === false){
        failedPayloads.push(payload);
        updateFailBanner();
      }
    }).catch(function(){
      failedPayloads.push(payload);
      updateFailBanner();
    });
  }

  failBannerBtn.addEventListener('click', function(){
    var toRetry = failedPayloads.slice();
    failedPayloads = [];
    updateFailBanner();
    toRetry.forEach(function(p){ backgroundSend(p); });
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    errBox.classList.remove('show');

    if (!salonSel.value){
      errBox.textContent = 'Vui lòng chọn Salon.';
      errBox.classList.add('show');
      return;
    }

    var items = [];
    for (var idx = 0; idx < ITEM_LIST.length; idx++){
      var tongEl = document.getElementById('tongSL_' + idx);
      var hongEl = document.getElementById('hongSL_' + idx);
      var tongSL = parseInt(tongEl.value, 10);
      var hongSL = parseInt(hongEl.value, 10);

      if (isNaN(tongSL) || tongSL < 0){
        errBox.textContent = 'Vui lòng điền Tổng số lượng cho mục "' + ITEM_LIST[idx].name + '".';
        errBox.classList.add('show');
        return;
      }
      if (tongSL === 0){
        items.push({ ten: ITEM_LIST[idx].name, tongSoLuong: 0, soLuongHong: 0, anh: [] });
        continue;
      }
      if (isNaN(hongSL) || hongSL < 0 || hongSL > tongSL){
        errBox.textContent = 'Số lượng hỏng/rách của mục "' + ITEM_LIST[idx].name + '" không hợp lệ (phải từ 0 đến Tổng số lượng).';
        errBox.classList.add('show');
        return;
      }
      if (!itemState[idx].selectedFiles.length){
        errBox.textContent = 'Vui lòng chụp/chọn ít nhất 1 ảnh cho mục "' + ITEM_LIST[idx].name + '".';
        errBox.classList.add('show');
        return;
      }
      items.push({ ten: ITEM_LIST[idx].name, tongSoLuong: tongSL, soLuongHong: hongSL, filesRef: idx });
    }

    summaryBody.innerHTML = '';
    var genTable = document.createElement('table');
    genTable.className = 'summary-table';
    [['Salon', salonSel.value], ['GDKV', gdkvInput.value]].forEach(function(r){
      var tr = document.createElement('tr');
      var tdK = document.createElement('td'); tdK.className='k'; tdK.textContent = r[0];
      var tdV = document.createElement('td'); tdV.className='v'; tdV.textContent = r[1];
      tr.appendChild(tdK); tr.appendChild(tdV);
      genTable.appendChild(tr);
    });
    summaryBody.appendChild(genTable);
    var itemsTable = document.createElement('table');
    itemsTable.className = 'summary-table';
    items.forEach(function(it){
      var tr = document.createElement('tr');
      var tdK = document.createElement('td'); tdK.className='k'; tdK.textContent = it.ten;
      var tdV = document.createElement('td'); tdV.className='v';
      tdV.textContent = it.tongSoLuong === 0 ? 'Không có tại salon' : (it.tongSoLuong + ' cái, hỏng ' + it.soLuongHong);
      tr.appendChild(tdK); tr.appendChild(tdV);
      itemsTable.appendChild(tr);
    });
    summaryBody.appendChild(itemsTable);
    overlay.classList.add('show');

    if (SHEET_ENDPOINT.indexOf('DAN_URL_APPS_SCRIPT') === -1){
      var encodePromises = items.map(function(it){
        if (it.filesRef === undefined) return Promise.resolve(it);
        var files = itemState[it.filesRef].selectedFiles.slice();
        return Promise.all(files.map(compressImage)).then(function(encoded){
          it.anh = encoded;
          delete it.filesRef;
          return it;
        });
      });
      Promise.all(encodePromises).then(function(finalItems){
        var payload = { salon: salonSel.value, gdkv: gdkvInput.value, items: finalItems };
        backgroundSend(payload);
      }).catch(function(){
        errBox.textContent = 'Lỗi khi xử lý ảnh, vui lòng thử gửi lại.';
        errBox.classList.add('show');
      });
    }
  });

  document.getElementById('summaryClose').addEventListener('click', function(){
    overlay.classList.remove('show');
  });
})();
</script>
