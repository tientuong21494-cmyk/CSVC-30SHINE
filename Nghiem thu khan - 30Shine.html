<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nghiệm thu Tiêu chuẩn Khăn</title>
<style>
  :root{
    --ink:#17171b; --sub:#5f5960; --paper:#f6f4f3; --card:#ffffff; --line:#e6e2e1;
    --accent:#1d3557; --accent-ink:#ffffff; --accent-soft:#e8edf5;
    --ok:#1f7a54; --ok-soft:#e6f4ec;
    --warn:#9a5b12; --warn-soft:#fbeed9;
    --bad:#b3122f; --bad-soft:#fbe9ea;
    --shadow: 0 1px 2px rgba(23,23,27,.06), 0 8px 24px -12px rgba(23,23,27,.14);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; max-width:100%; overflow-x:hidden;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14.5px; line-height:1.5;
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--paper);
    border-bottom:1px solid var(--line); padding:16px clamp(14px,4vw,40px) 14px;
  }
  .brand{font-weight:800; font-size:15px; letter-spacing:.02em;}
  .brand span{color:var(--accent);}
  .hub-sub{color:var(--sub); font-size:12.5px; margin-top:2px;}
  main{max-width:1080px; margin:0 auto; padding:20px clamp(14px,4vw,40px) 80px;}

  .nt-meta{
    display:grid; grid-template-columns:1fr; gap:12px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; box-shadow:var(--shadow); margin-bottom:14px;
  }
  @media (min-width:640px){ .nt-meta{grid-template-columns:1.3fr 1fr 1.3fr auto;} }
  .nt-meta label{display:flex; flex-direction:column; gap:6px; font-size:11px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.04em;}
  .nt-meta input, .nt-meta select{
    font-family:inherit; font-size:14px; font-weight:500; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:9px 11px;
  }
  .btn{
    font-weight:800; font-size:13px; background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:8px; padding:10px 18px; cursor:pointer; white-space:nowrap; height:fit-content;
  }
  .btn:hover{opacity:.92;}
  .btn.ghost{background:none; color:var(--accent); font-size:11.5px; padding:0; text-decoration:none; font-weight:700;}

  .owner-chip{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;
    padding:3px 8px; border-radius:999px; background:var(--warn-soft); color:var(--warn);
    white-space:nowrap; margin:2px 0 12px;
  }
  .status{display:block; font-size:12px; color:var(--sub); margin:2px 0 16px;}
  .status.good{color:var(--ok);}
  .status.warn{color:var(--warn);}
  .status.bad{color:var(--bad);}

  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); background:var(--card);}
  table.checklist{width:100%; border-collapse:collapse; min-width:900px; font-size:13px;}
  table.checklist th{
    background:#eef1f6; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--sub);
    font-weight:700; padding:9px 10px; text-align:left; white-space:nowrap; position:sticky; top:0;
  }
  table.checklist td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.checklist tr:last-child td{border-bottom:none;}
  .col-zone{width:130px; font-weight:700; color:var(--sub); font-size:11.5px;}
  .col-stt{width:34px; text-align:center; color:var(--sub);}
  .col-item{width:170px; font-weight:700;}
  .col-std{width:300px; color:var(--ink); font-size:12px; font-weight:600;}
  .col-illust{width:210px;}
  .col-photo{width:220px;}
  .note-input{
    display:block; width:100%; margin-top:6px; font-family:inherit; font-size:12px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:6px 8px;
  }

  @media (max-width:700px){
    .table-wrap{overflow-x:visible; border:none; box-shadow:none; background:none;}
    table.checklist{min-width:0;}
    table.checklist thead{display:none;}
    table.checklist, table.checklist tbody, table.checklist tr{display:block; width:100%;}
    table.checklist tr{
      background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); margin-bottom:12px; padding:12px 14px;
    }
    table.checklist td{display:block; width:100% !important; padding:6px 0; border-bottom:none;}
    table.checklist td.col-stt{color:var(--sub); font-size:11px; font-weight:700; padding-top:0;}
    table.checklist td.col-stt::before{content:"STT "; }
    table.checklist td.col-zone{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); font-weight:800;}
    table.checklist td.col-item{font-size:15px; font-weight:800;}
    table.checklist td.col-std{padding-top:4px;}
    table.checklist td.col-std::before{content:"Tiêu chuẩn: "; font-weight:800; color:var(--ink);}
    table.checklist td.col-illust::before{content:"Ảnh minh họa Đúng: "; font-weight:800; color:var(--ink); display:block; margin-bottom:4px;}
    table.checklist td.col-photo::before{content:"Nghiệm thu: "; font-weight:800; color:var(--ink); display:block; margin-bottom:4px;}
  }
  .video-tag{display:inline-block; font-size:10px; font-weight:700; color:var(--warn); background:var(--warn-soft); border:1px solid #e3c48a; border-radius:999px; padding:1px 6px; margin-left:4px; vertical-align:2px; white-space:nowrap;}
  .std-list{margin:0; padding-left:16px;}
  .std-list li{margin:4px 0;}
  .std-list b{color:var(--ink);}

  .illust-gallery{display:flex; flex-wrap:wrap; gap:6px;}
  .illust-thumb{width:64px; height:64px; border-radius:6px; object-fit:cover; border:1px solid var(--line); display:block; cursor:zoom-in;}
  .illust-missing{font-size:11px; color:var(--sub); font-style:italic;}
  .illust-cols{display:flex; flex-wrap:wrap; gap:10px;}
  .illust-col{flex:1 1 120px; min-width:120px;}
  .illust-col-label{font-size:10px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px;}

  .lightbox-overlay{position:fixed; inset:0; background:rgba(10,14,20,.88); display:flex; align-items:center; justify-content:center; z-index:1000; padding:2rem;}
  .lightbox-overlay .lb-img{max-width:100%; max-height:100%; border-radius:8px;}
  .lightbox-overlay button{position:absolute; color:#fff; background:rgba(0,0,0,.35); border:none; cursor:pointer;}
  .lb-close{top:1rem; right:1.2rem; font-size:2rem; border-radius:8px; padding:0 .6rem; line-height:1.4;}
  .lb-nav{top:50%; transform:translateY(-50%); font-size:2.2rem; width:2.6rem; height:2.6rem; border-radius:50%;}
  .lb-prev{left:.8rem;} .lb-next{right:.8rem;}
  .lb-counter{position:absolute; bottom:1rem; left:50%; transform:translateX(-50%); color:#fff; font-size:.8rem; background:rgba(0,0,0,.4); border-radius:999px; padding:.25rem .8rem;}

  .photo-gallery{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
  .photo-thumb-wrap{position:relative; width:52px; height:52px;}
  .photo-thumb{width:52px; height:52px; border-radius:6px; object-fit:cover; border:1px solid var(--line); display:block;}
  .photo-del{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--bad); color:#fff; border:2px solid var(--card); font-size:11px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .photo-pending{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--warn); color:#fff; border:2px solid var(--card); font-size:10px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .photo-add-btn{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; color:var(--accent);
    border:1.5px dashed #a9bcd6; border-radius:8px; padding:6px 10px; cursor:pointer; background:var(--accent-soft);
  }
  .photo-add-btn input{display:none;}
  .photo-disabled{font-size:11px; color:var(--sub); font-style:italic;}

  .video-list{display:flex; flex-direction:column; gap:6px; margin-bottom:6px;}
  .video-row{display:flex; align-items:center; gap:6px;}
  .video-link{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; color:var(--accent); text-decoration:none; background:var(--accent-soft); border-radius:6px; padding:5px 8px;}
  .video-pending{font-size:12px; color:var(--warn); font-weight:700;}
  .video-del{position:static !important; width:18px; height:18px; flex:none;}
  .video-hint{font-size:10.5px; color:var(--sub); display:block; margin-top:3px;}

  @media (max-width:420px){
    header{padding:14px 16px 12px;}
    main{padding:16px 16px 70px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">30<span>SHINE</span> · TIÊU CHUẨN KHĂN</div>
  <div class="hub-sub">Phiếu nghiệm thu — không cần đăng nhập</div>
</header>

<main>
  <div class="nt-meta">
    <label>Salon
      <select id="ntSalon"><option value="">— Chọn salon —</option></select>
    </label>
    <label>Kỳ nghiệm thu
      <div style="display:flex; gap:6px;">
        <select id="ntMonth" style="flex:1;"></select>
        <select id="ntYear" style="flex:1;"></select>
      </div>
    </label>
    <label>Người nghiệm thu
      <input id="ntNguoi" type="text" placeholder="Họ tên GĐKV / quản lý">
    </label>
    <button class="btn" id="ntLoadBtn" type="button">Tải / Tạo phiếu</button>
  </div>
  <span class="status" id="ntStatus">Chọn salon và kỳ, rồi bấm "Tải / Tạo phiếu" để bắt đầu.</span>
  <div id="ntDeleteWrap" style="display:none; margin:-8px 0 14px;">
    <button class="btn ghost" id="ntDeleteBtn" type="button">🗑 Xoá phiếu này (tạo trùng / sai salon)</button>
  </div>

  <div class="table-wrap" id="ntTableWrap" style="display:none;">
    <table class="checklist">
      <thead>
        <tr>
          <th class="col-stt">STT</th>
          <th class="col-zone">Nhóm</th>
          <th class="col-item">Hạng mục kiểm tra</th>
          <th class="col-std">Tiêu chuẩn Đúng / Sai</th>
          <th class="col-illust">Ảnh minh họa Đúng</th>
          <th class="col-photo">Nghiệm thu</th>
        </tr>
      </thead>
      <tbody id="ntTableBody"></tbody>
    </table>
  </div>

  <div id="ntSubmitWrap" style="display:none; margin-top:18px; text-align:center;">
    <button class="btn" id="ntSubmitBtn" type="button" style="width:100%; max-width:360px; font-size:14.5px; padding:13px 20px;">✅ Gửi phiếu nghiệm thu</button>
    <div class="status" id="ntSubmitStatus" style="margin-top:8px;"></div>
  </div>
</main>

  function illustGalleryHtml(keys){
    var html = '<div class="illust-gallery">';
    keys.forEach(function(key){
      var src = ILLUST[key];
      if (src) html += '<img class="illust-thumb" src="' + src + '" alt="Ảnh minh họa Đúng">';
    });
    html += '</div>';
    return html;
  }
  function illustrationCellHtml(it){
    if (it.imgGroups){
      var html = '<div class="illust-cols">';
      it.imgGroups.forEach(function(g){
        html += '<div class="illust-col"><div class="illust-col-label">' + g.label + '</div>' + illustGalleryHtml(g.keys) + '</div>';
      });
      html += '</div>';
      return html;
    }
    if (it.img === undefined) return '';
    if (!it.img.length) return '<span class="illust-missing">Chưa có ảnh — bổ sung sau</span>';
    return illustGalleryHtml(it.img);
  }

  // Lightbox xem ảnh minh họa toàn màn hình
  var lbOverlay = null, lbImg = null, lbCounter = null, lbList = [], lbIndex = 0;
  function ensureLightbox(){
    if (lbOverlay) return;
    lbOverlay = document.createElement('div');
    lbOverlay.className = 'lightbox-overlay';
    lbOverlay.style.display = 'none';
    lbOverlay.innerHTML =
      '<button type="button" class="lb-close" aria-label="Đóng">×</button>' +
      '<button type="button" class="lb-nav lb-prev" aria-label="Ảnh trước">‹</button>' +
      '<img class="lb-img" src="" alt="Ảnh minh họa">' +
      '<button type="button" class="lb-nav lb-next" aria-label="Ảnh sau">›</button>' +
      '<span class="lb-counter"></span>';
    document.body.appendChild(lbOverlay);
    lbImg = lbOverlay.querySelector('.lb-img');
    lbCounter = lbOverlay.querySelector('.lb-counter');
    lbOverlay.querySelector('.lb-close').addEventListener('click', closeLightbox);
    lbOverlay.addEventListener('click', function(e){ if (e.target === lbOverlay) closeLightbox(); });
    lbOverlay.querySelector('.lb-prev').addEventListener('click', function(){ showLightbox(lbIndex - 1); });
    lbOverlay.querySelector('.lb-next').addEventListener('click', function(){ showLightbox(lbIndex + 1); });
    document.addEventListener('keydown', function(e){
      if (!lbOverlay || lbOverlay.style.display === 'none') return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') showLightbox(lbIndex - 1);
      else if (e.key === 'ArrowRight') showLightbox(lbIndex + 1);
    });
  }
  function showLightbox(idx){
    if (!lbList.length) return;
    lbIndex = (idx + lbList.length) % lbList.length;
    lbImg.src = lbList[lbIndex];
    lbCounter.textContent = (lbIndex + 1) + ' / ' + lbList.length;
    var multi = lbList.length > 1;
    lbOverlay.querySelector('.lb-prev').style.display = multi ? '' : 'none';
    lbOverlay.querySelector('.lb-next').style.display = multi ? '' : 'none';
    lbOverlay.style.display = 'flex';
  }
  function closeLightbox(){ if (lbOverlay) lbOverlay.style.display = 'none'; }
  function openLightboxFrom(imgEl){
    ensureLightbox();
    var gallery = imgEl.closest('.illust-gallery');
    var imgs = gallery ? Array.prototype.slice.call(gallery.querySelectorAll('.illust-thumb')) : [imgEl];
    lbList = imgs.map(function(im){ return im.src; });
    var idx = imgs.indexOf(imgEl);
    showLightbox(idx < 0 ? 0 : idx);
  }

  // Vùng/GDKV vừa xáo trộn lại nên danh sách salon để phẳng, không gộp nhóm theo GDKV nữa

    '10 TP','103 TN','1146 KVC','1180 QT','11 PKT','113 THD AG','116 TK','12 LDT','145 THT','148 TD',
    '168 NVC','173 TN','186 DTH','186 QT','190 HB','1371 PVT','202 DC','236 DBT','237 NTT','25 TD',
    '255 NAN','264 LLQ','290 QT TH','29 HB','304 NT TH','312 LVS','32 NAT','346 KT','36 N1 BD','362 NGT BN',
    '363 LNQ TN','382 NT','39 HBT','401/1 NDT','420 HTP','4 LQD BN','483 TN','50BT4 NPC LD','55A NVL','575 AC',
    '58 NVC','595 BT TH','62 LH','65 CD','68 LN NA','708 LTT','7 DTP LA','730 TL10','76 PVH','80 PL BD',
    '80 TP TH','8 CVL','90 NH','927 HG','99 TSN'
  ];

  function callApi(action, data){
    var payload = Object.assign({ action: action }, data || {});
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)

  // ---------- Salon select ----------
  var elSalon = document.getElementById('ntSalon');
  (function(){
    var html = '<option value="">— Chọn salon —</option>';
    SALON_LIST.forEach(function(s){ html += '<option value="' + s + '">' + s + '</option>'; });
    elSalon.innerHTML = html;
  })();

  var elMonth = document.getElementById('ntMonth');
  var elYear = document.getElementById('ntYear');
  function getPeriod(){
    var pad = function(n){ return (n<10?'0':'')+n; };
    return elYear.value + '-' + pad(parseInt(elMonth.value, 10));
  }
  var elNguoi = document.getElementById('ntNguoi');
  var elLoadBtn = document.getElementById('ntLoadBtn');
  var elDeleteWrap = document.getElementById('ntDeleteWrap');
  var elDeleteBtn = document.getElementById('ntDeleteBtn');
  var elStatus = document.getElementById('ntStatus');
  var elTableWrap = document.getElementById('ntTableWrap');
  var elTableBody = document.getElementById('ntTableBody');
  elTableBody.addEventListener('click', function(e){
    var t = e.target;
    if (t && t.classList && t.classList.contains('illust-thumb')) openLightboxFrom(t);
  });
  var elSubmitWrap = document.getElementById('ntSubmitWrap');
  var elSubmitBtn = document.getElementById('ntSubmitBtn');
  var elSubmitStatus = document.getElementById('ntSubmitStatus');

  (function(){
    var now = new Date();
    var monthHtml = '';
    for (var m = 1; m <= 12; m++){ monthHtml += '<option value="' + m + '"' + (m === now.getMonth()+1 ? ' selected' : '') + '>Tháng ' + m + '</option>'; }
    elMonth.innerHTML = monthHtml;
    var yearHtml = '';
    var curYear = now.getFullYear();
    for (var y = curYear - 1; y <= curYear + 1; y++){ yearHtml += '<option value="' + y + '"' + (y === curYear ? ' selected' : '') + '>' + y + '</option>'; }
    elYear.innerHTML = yearHtml;
  })();

  var state = null;

  function fmtTime(iso){
    if (!iso) return '';
    try{
      var d = new Date(iso);
      var pad = function(n){ return (n<10?'0':'')+n; };
      return pad(d.getHours())+':'+pad(d.getMinutes())+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
    }catch(e){ return ''; }
  }
  function setStatus(msg, kind){
    elStatus.textContent = msg;
    elStatus.className = 'status' + (kind ? ' ' + kind : '');
  }
  function resetFormForNewSelection(){
    // Đổi salon/tháng/năm mà chưa bấm "Tải / Tạo phiếu" lại thì ẩn bảng cũ đi ngay,
    // tránh trường hợp tích/tải ảnh bị lưu nhầm sang salon vừa chọn trước đó.
    state = null;
    elTableWrap.style.display = 'none';
    elSubmitWrap.style.display = 'none';
    elDeleteWrap.style.display = 'none';
    setStatus('Đã đổi lựa chọn — bấm "Tải / Tạo phiếu" để mở phiếu tương ứng.', 'warn');
  }
  elSalon.addEventListener('change', resetFormForNewSelection);
  elMonth.addEventListener('change', resetFormForNewSelection);
  elYear.addEventListener('change', resetFormForNewSelection);

  function blankState(salon, period){
    return { salon: salon, period: period, nguoi: elNguoi.value.trim(), items: {} };
  }

  function loadRecord(){
    var salon = elSalon.value.trim();
    var period = getPeriod();
    if (!salon || !period){ setStatus('Chọn salon và kỳ (tháng) trước khi tải phiếu.', 'warn'); return; }
    elDeleteWrap.style.display = 'block';
    setStatus('Đang tải phiếu...', '');
    callApi('getRecord', { salon: salon, period: period }).then(function(rec){
      if (rec && rec.ok === false){ throw new Error(rec.error || 'lỗi'); }
      if (rec && rec.exists){
        state = { salon: rec.salon || salon, period: rec.period || period, nguoi: rec.nguoi || elNguoi.value.trim(), items: rec.items || {} };
        elNguoi.value = state.nguoi;
        setStatus('Đã tải phiếu đã lưu' + (rec.updatedAt ? ' · cập nhật lúc ' + fmtTime(rec.updatedAt) : ''), 'good');
      } else {
        state = blankState(salon, period);
        setStatus('Phiếu mới cho ' + salon + ' — chưa có dữ liệu, bắt đầu tích nhé.', '');
      }
      renderTable();
    }).catch(function(err){
      state = blankState(salon, period);
      setStatus('Không tải được dữ liệu đã lưu (' + (err && err.message || 'lỗi') + ') — đang dùng phiếu tạm.', 'bad');
      renderTable();
    });
  }

  var MAX_PHOTOS_PER_ITEM = 10;

  function photoGalleryHtml(itemId, photos){
    if (!photos || !photos.length) return '';
    var html = '<div class="photo-gallery">';
    photos.forEach(function(p){
      html +=
        '<div class="photo-thumb-wrap">' +
          '<img class="photo-thumb" src="' + p.photoUrl + '" alt="Ảnh nghiệm thu">' +
          (p.pending
            ? '<div class="photo-pending" title="Đang tải lên...">⏳</div>'
            : '<button type="button" class="photo-del" data-delphoto="' + itemId + '" data-photoid="' + p.photoId + '">×</button>') +
        '</div>';
    });
    html += '</div>';
    return html;
  }

  function videoBlockHtml(itemId, videos){
    var html = '';
    if (videos && videos.length){
      html += '<div class="video-list">';
      videos.forEach(function(v){
        if (v.pending){
          html += '<div class="video-row"><span class="video-pending">⏳ Đang tải video...</span></div>';
        } else {
          html +=
            '<div class="video-row">' +
              '<a class="video-link" href="' + v.photoUrl + '" target="_blank" rel="noopener">▶️ Xem video</a>' +
              '<button type="button" class="photo-del video-del" data-delphoto="' + itemId + '" data-photoid="' + v.photoId + '">×</button>' +
            '</div>';
        }
      });
      html += '</div>';
    } else {
      html +=
        '<label class="photo-add-btn">🎥 Quay / chọn video<input type="file" accept="video/*" capture="environment" data-upload-video="' + itemId + '"></label>' +
        '<span class="video-hint">1 đoạn, quay lần lượt đủ 6 điểm</span>';
    }
    return html;
  }

  function evidenceCellHtml(it, rec){
    var photos = rec.photos || [];
    if (it.kind === 'video') return videoBlockHtml(it.id, photos);
    return photoGalleryHtml(it.id, photos) +
      (photos.length >= MAX_PHOTOS_PER_ITEM
        ? '<span class="photo-disabled">Đã đủ ' + MAX_PHOTOS_PER_ITEM + ' ảnh</span>'
        : '<label class="photo-add-btn">+ Ảnh (' + photos.length + '/' + MAX_PHOTOS_PER_ITEM + ')<input type="file" accept="image/*" multiple data-upload="' + it.id + '"></label>');
  }

  function rowHtml(it, stt){
    var rec = state.items[it.id] || {};
    return (
      '<tr data-item="' + it.id + '">' +
        '<td class="col-stt">' + stt + '</td>' +
        '<td class="col-zone">' + it.nhom + '</td>' +
        '<td class="col-item">' + it.hangmuc + (it.kind === 'video' ? ' <span class="video-tag">🎥 Video</span>' : '') + '</td>' +
        '<td class="col-std">' + stdCellHtml(it) + '</td>' +
        '<td class="col-illust">' + illustrationCellHtml(it) + '</td>' +
        '<td class="col-photo">' + evidenceCellHtml(it, rec) +
          '<input type="text" class="note-input" data-note="' + it.id + '" placeholder="Ghi chú" value="' + (rec.ghiChu || '').replace(/"/g, '&quot;') + '">' +
        '</td>' +
      '</tr>'
    );
  }

  function renderTable(){
    elTableWrap.style.display = 'block';
    elSubmitWrap.style.display = 'block';
    var html = '';
    CHECKLIST_ITEMS.forEach(function(it, idx){ html += rowHtml(it, idx + 1); });
    elTableBody.innerHTML = html;
    wireTableEvents();
  }

  function saveOne(itemId, extra){
    var rec = state.items[itemId] || {};
    var item = CHECKLIST_BY_ID[itemId];
    var idx = CHECKLIST_ITEMS.indexOf(item) + 1;
    var payload = {
      salon: state.salon, period: state.period, nguoi: elNguoi.value.trim(),
      itemId: itemId, nhom: item.nhom, stt: idx, hangmuc: item.hangmuc, tieuChuan: stdTextFor(item),
      ghiChu: rec.ghiChu || ''
    };
    Object.assign(payload, extra || {});
    setStatus('Đang lưu...', '');
    return callApi('saveItem', payload).then(function(res){
      if (res && res.ok === false){ throw new Error(res.error || 'lỗi'); }
      setStatus('Đã lưu lúc ' + fmtTime(res.updatedAt), 'good');
      return res;
    }).catch(function(err){
      setStatus('Lưu thất bại (' + (err && err.message || 'lỗi') + ')', 'bad');
      throw err;
    });
  }

  function wireTableEvents(){
    elTableBody.querySelectorAll('[data-note]').forEach(function(ta){
      ta.addEventListener('blur', function(){
        var id = ta.getAttribute('data-note');
        state.items[id] = Object.assign({}, state.items[id], { ghiChu: ta.value });
        saveOne(id).catch(function(err){
          alert('⚠️ Lưu ghi chú thất bại (' + (err && err.message || 'lỗi') + ').\nVui lòng thử lại.');
        });
      });
    });
    elTableBody.querySelectorAll('[data-upload]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var id = inp.getAttribute('data-upload');
        var files = inp.files;
        if (files && files.length) uploadPhotos(id, files);
      });
    });
    elTableBody.querySelectorAll('[data-upload-video]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var id = inp.getAttribute('data-upload-video');
        var files = inp.files;
        if (files && files.length) uploadVideo(id, files[0]);
      });
    });
    elTableBody.querySelectorAll('[data-delphoto]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-delphoto');
        var photoId = btn.getAttribute('data-photoid');
        if (!confirm('Xoá mục này?')) return;
        setStatus('Đang xoá...', '');
        callApi('deletePhoto', { salon: state.salon, period: state.period, itemId: id, photoId: photoId }).then(function(){
          var rec = state.items[id] || {};
          rec.photos = (rec.photos || []).filter(function(p){ return p.photoId !== photoId; });
          state.items[id] = rec;
          renderTable();
          setStatus('Đã xoá.', 'good');
        }).catch(function(err){ setStatus('Xoá lỗi (' + (err && err.message || 'lỗi') + ')', 'bad'); });
      });
    });
  }

  function fmtTimestampLine(d){
    var pad = function(n){ return (n<10?'0':'')+n; };
    var wd = ['CN','Th2','Th3','Th4','Th5','Th6','Th7'][d.getDay()];
    return wd + ' ' + pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function burnTimestamp(canvas, ctx, labelLine, timeLine){
    var cw = canvas.width, ch = canvas.height;
    var fontSize = Math.max(15, Math.round(cw * 0.032));
    var pad = Math.round(fontSize * 0.65);
    var lineH = Math.round(fontSize * 1.3);
    var lines = [labelLine, timeLine].filter(Boolean);
    var barH = lineH * lines.length + pad * 1.6;
    var grad = ctx.createLinearGradient(0, ch - barH, 0, ch);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, ch - barH, cw, barH);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = Math.round(fontSize * 0.15);
    var y = ch - pad;
    for (var i = lines.length - 1; i >= 0; i--){
      ctx.font = (i === lines.length - 1 ? '700 ' : '500 ') + fontSize + 'px -apple-system, "Segoe UI", Arial, sans-serif';
      ctx.fillText(lines[i], pad, y);
      y -= lineH;
    }
    ctx.shadowBlur = 0;
  }
  function processPhoto(file, maxDim, quality, labelLine){
    return new Promise(function(resolve){
      if (!file.type || file.type.indexOf('image/') !== 0 || file.type === 'image/gif' || file.type === 'image/svg+xml'){
        var fr = new FileReader();
        fr.onload = function(){ resolve(fr.result); };
        fr.readAsDataURL(file);
        return;
      }
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        try{ burnTimestamp(canvas, ctx, labelLine, fmtTimestampLine(new Date())); }catch(e){}
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = function(){
        URL.revokeObjectURL(url);
        var fr = new FileReader();
        fr.onload = function(){ resolve(fr.result); };
        fr.readAsDataURL(file);
      };
      img.src = url;
    });
  }

  function uploadPhotos(itemId, fileList){
    var files = Array.prototype.slice.call(fileList);
    var existingCount = ((state.items[itemId] || {}).photos || []).length;
    var remaining = MAX_PHOTOS_PER_ITEM - existingCount;
    if (remaining <= 0){
      alert('Hạng mục này đã có đủ ' + MAX_PHOTOS_PER_ITEM + ' ảnh — xoá bớt ảnh cũ trước khi thêm ảnh mới.');
      return;
    }
    if (files.length > remaining){
      alert('Hạng mục này chỉ còn ' + remaining + ' chỗ trống (tối đa ' + MAX_PHOTOS_PER_ITEM + ' ảnh/hạng mục). Chỉ lấy ' + remaining + ' ảnh đầu trong số ' + files.length + ' ảnh vừa chọn.');
      files = files.slice(0, remaining);
    }
    var item = CHECKLIST_BY_ID[itemId];
    var label = (state.salon || '') + (item ? ' · ' + item.hangmuc : '');
    if (label.length > 60) label = label.slice(0, 57) + '...';
    Promise.all(files.map(function(f){ return processPhoto(f, 1024, 0.6, label); })).then(function(dataUrls){
      // Hiện ảnh ngay tại chỗ (xem trước) trong lúc vẫn đang tải lên nền, đỡ phải chờ nhìn màn hình trống
      var before = (state.items[itemId] || {}).photos || [];
      var pendingPhotos = dataUrls.map(function(u){ return { photoUrl: u, pending: true }; });
      state.items[itemId] = Object.assign({}, state.items[itemId], { photos: before.concat(pendingPhotos) });
      renderTable();
      return saveOne(itemId, { photosBase64: dataUrls });
    }).then(function(res){
      state.items[itemId] = Object.assign({}, state.items[itemId], { photos: res.photos });
      renderTable();
    }).catch(function(err){
      var before = (state.items[itemId] || {}).photos || [];
      state.items[itemId] = Object.assign({}, state.items[itemId], { photos: before.filter(function(p){ return !p.pending; }) });
      renderTable();
      alert('Tải ảnh lỗi (' + (err && err.message || 'lỗi') + '), thử lại.');
    });
  }

  // ---- Video (1 đoạn / hạng mục) ----
  var MAX_VIDEO_BYTES = 25 * 1024 * 1024; // ~25MB — giữ clip ngắn (15-30 giây) để gửi lên chắc chắn thành công

  function readFileAsDataUrl(file){
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onload = function(){ resolve(fr.result); };
      fr.onerror = function(){ reject(fr.error || new Error('Đọc file lỗi')); };
      fr.readAsDataURL(file);
    });
  }

  function uploadVideo(itemId, file){
    if (file.size > MAX_VIDEO_BYTES){
      alert('Video quá lớn (~' + Math.round(file.size/1024/1024) + 'MB). Quay clip ngắn hơn (khoảng 15-30 giây, dưới 25MB) rồi thử lại.');
      return;
    }
    var mimeType = file.type || 'video/mp4';
    readFileAsDataUrl(file).then(function(dataUrl){
      var before = (state.items[itemId] || {}).photos || [];
      state.items[itemId] = Object.assign({}, state.items[itemId], { photos: before.concat([{ photoUrl: dataUrl, pending: true }]) });
      renderTable();
      return saveOne(itemId, { photosBase64: [dataUrl], fileKind: 'video', mimeType: mimeType });
    }).then(function(res){
      state.items[itemId] = Object.assign({}, state.items[itemId], { photos: res.photos });
      renderTable();
    }).catch(function(err){
      var before = (state.items[itemId] || {}).photos || [];
      state.items[itemId] = Object.assign({}, state.items[itemId], { photos: before.filter(function(p){ return !p.pending; }) });
      renderTable();
      alert('Tải video lỗi (' + (err && err.message || 'lỗi') + '), thử lại.');
    });
  }

  elLoadBtn.addEventListener('click', loadRecord);
  elDeleteBtn.addEventListener('click', function(){
    if (!state) return;
    if (!confirm('Xoá toàn bộ phiếu "' + state.salon + ' — ' + state.period + '"? Không hoàn tác được.')) return;
    setStatus('Đang xoá phiếu...', '');
    callApi('deleteRecord', { salon: state.salon, period: state.period }).then(function(){
      setStatus('Đã xoá phiếu.', 'good');
      elTableWrap.style.display = 'none'; elDeleteWrap.style.display = 'none';
      state = null;
    }).catch(function(err){ setStatus('Xoá thất bại (' + (err && err.message || 'lỗi') + ')', 'bad'); });
  });

  elSubmitBtn.addEventListener('click', function(){
    if (!state){ alert('Chưa có phiếu nào đang mở — chọn salon + kỳ và bấm "Tải / Tạo phiếu" trước.'); return; }
    elSubmitBtn.disabled = true;
    elSubmitBtn.textContent = 'Đang gửi...';
    elSubmitStatus.textContent = 'Đang lưu lại toàn bộ ' + CHECKLIST_ITEMS.length + ' hạng mục...';
    elSubmitStatus.className = 'status';
    var nguoi = elNguoi.value.trim();
    var items = CHECKLIST_ITEMS.map(function(it, idx){
      var rec = state.items[it.id] || {};
      return { itemId: it.id, nhom: it.nhom, stt: idx + 1, hangmuc: it.hangmuc, tieuChuan: stdTextFor(it), ghiChu: rec.ghiChu || '' };
    });
    callApi('saveBatch', { salon: state.salon, period: state.period, nguoi: nguoi, items: items })
      .then(function(res){
        if (res && res.ok === false){ throw new Error(res.error || 'lỗi'); }
        elSubmitBtn.disabled = false;
        elSubmitBtn.textContent = '✅ Gửi phiếu nghiệm thu';
        var now = new Date();
        var pad = function(n){ return (n<10?'0':'')+n; };
        var timeStr = pad(now.getHours())+':'+pad(now.getMinutes())+' '+pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear();
        elSubmitStatus.textContent = '✅ Đã gửi thành công lúc ' + timeStr + ' — toàn bộ ' + CHECKLIST_ITEMS.length + ' hạng mục đã lên Google Sheet.';
        elSubmitStatus.className = 'status good';
      })
      .catch(function(err){
        elSubmitBtn.disabled = false;
        elSubmitBtn.textContent = '✅ Gửi phiếu nghiệm thu';
        elSubmitStatus.textContent = '⚠️ Gửi lỗi (' + (err && err.message || 'lỗi') + ') — kiểm tra lại đường truyền rồi bấm Gửi lại.';
        elSubmitStatus.className = 'status bad';
        alert('⚠️ GỬI PHIẾU THẤT BẠI (' + (err && err.message || 'lỗi') + ')\nDữ liệu CHƯA lên Google Sheet — vui lòng bấm "Gửi phiếu nghiệm thu" lại.');
      });
  });
})();
